[package]
name = "fgba-wasm"
description = "Browser visualization of FGBA aggregates and exact features over sparse signed ranges"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
a5 = "=1.0.0"
datafusion = { version = "=48.0.1", default-features = false, features = ["recursive_protection"] }
fgba = { version = "0.1.0", path = "../fgba", features = ["analytics"] }
fgba-sql = { version = "0.1.0", path = "../fgba-sql" }
flatgeobuf = { version = "=6.0.1", default-features = false }
futures = "=0.3.34"
geozero = { version = "=0.15.1", default-features = false, features = ["with-geojson"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3.24.0"
