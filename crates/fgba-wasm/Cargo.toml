[package]
name = "fgba-wasm"
description = "Browser visualization of FGBA aggregates and exact features over sparse signed ranges"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
a5 = "=1.0.0"
fgba = { version = "0.1.0", path = "../fgba", features = ["analytics"] }
flatgeobuf = { version = "=6.0.1", default-features = false }
geozero = { version = "=0.15.1", default-features = false, features = ["with-geojson"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
