[package]
name = "fgba-cli"
description = "fgba command line tool: convert, build, info, stats, verify, serve, bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "fgba"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
fgba = { path = "../fgba", features = ["http"] }
flatgeobuf = { version = "6.0.1", default-features = false }
geo-types = "0.7"
geojson = "0.24"
geozero = { version = "0.15.1", default-features = false, features = [
    "with-geo",
    "with-wkt",
] }
shapefile = "0.9"
