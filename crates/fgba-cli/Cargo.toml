[package]
name = "fgba-cli"
description = "Command line tool for FGBA (FlatGeobuf Aggregates) files: convert, build, info, stats, verify, serve, and bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gis", "geospatial", "flatgeobuf", "cli", "vector"]
categories = ["science::geo", "command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "fgba"
path = "src/main.rs"

[dependencies]
arrow-ipc = { version = "=55.2.0", default-features = false }
arrow-schema = { version = "=55.2.0", default-features = false }
clap = { version = "4", features = ["derive"] }
csv = "1"
fgba = { version = "0.1.0", path = "../fgba", features = ["http", "analytics"] }
fgba-sql = { version = "0.1.0", path = "../fgba-sql" }
flatgeobuf = { version = "6.0.1", default-features = false }
geo-types = "0.7"
geojson = "0.24"
geozero = { version = "0.15.1", default-features = false, features = [
    "with-geo",
    "with-wkt",
] }
shapefile = "0.9"
tokio = { version = "=1.54.1", features = ["rt", "sync"] }
