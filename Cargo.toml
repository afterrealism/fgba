[workspace]
resolver = "2"
members = ["crates/fgba", "crates/fgba-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV 1.85: required by flatgeobuf 6.0.1, geozero 0.15.1, ureq 3 and clap 4.
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/afterrealism/fgba"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
