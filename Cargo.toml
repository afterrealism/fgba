[workspace]
resolver = "2"
members = ["crates/fgba", "crates/fgba-cli", "crates/fgba-sql", "crates/fgba-wasm", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Minimum supported Rust version for the complete locked dependency graph.
rust-version = "1.91"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/afterrealism/fgba"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
