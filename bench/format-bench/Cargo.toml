[package]
name = "format-bench"
version = "0.1.0"
edition = "2021"

# Standalone benchmark harness; intentionally excluded from the main workspace.
[workspace]

[dependencies]
fgba = { path = "../../crates/fgba" }
flatgeobuf = "6.0.1"
geo = "0.30"
geo-types = "0.7"
geozero = "0.15"
geojson = "0.24"
shapefile = { version = "0.7", features = ["geo-types"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
csv = "1"
dbase = "0.6"

[profile.release]
debug = false
